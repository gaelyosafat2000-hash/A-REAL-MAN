# Verificación automática en cada push a main y en cada pull request.
# Las acciones están fijadas por SHA (con la versión en comentario) para evitar
# ataques de cadena de suministro; Dependabot las mantiene actualizadas.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, formato y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Versiones compatibles con el SDK de Expo
        run: npx expo install --check

      - name: Typecheck, lint, formato y tests
        run: npm run check

      - name: Auditoría de contexto de Claude Code
        run: npm run audit:context

      - name: Vulnerabilidades altas o críticas
        run: npm audit --audit-level=high
